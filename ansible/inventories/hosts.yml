---
# Inventory for Rin deployment
# Support both Cloudflare and homelab deployments

all:
  children:
    cloudflare:
      hosts:
        cloudflare_deployment:
          ansible_connection: local
          deployment_type: cloudflare
          domain: cloudcurio.cc
          cloudflare_zone_id: "{{ lookup('env', 'CLOUDFLARE_ZONE_ID') }}"
          cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"
          cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
          
    homelab:
      hosts:
        homelab_server:
          # Update these values for your homelab server
          ansible_host: "{{ lookup('env', 'HOMELAB_HOST') | default('192.168.1.100', true) }}"
          ansible_port: 22
          ansible_user: "{{ lookup('env', 'HOMELAB_USER') | default('ubuntu', true) }}"
          deployment_type: homelab
          domain: cloudcurio.cc
          
  vars:
    # Common variables for all deployments
    app_name: rin
    app_user: rin
    app_group: rin
    app_port: 11498
    frontend_port: 5173
    
    # Application paths
    app_base_dir: "/opt/{{ app_name }}"
    app_repo_url: "https://github.com/openRin/Rin.git"
    app_branch: main
    
    # Node/Bun configuration
    node_version: "22"
    bun_version: "1.2.13"
    
    # Database configuration
    db_name: rin
    worker_name: rin-server
    
    # S3 Configuration
    s3_region: auto
    s3_folder: images/
    s3_cache_folder: cache/
    s3_force_path_style: "false"
    
    # RSS Configuration
    rss_title: "Rin Blog"
    rss_description: "A blog powered by Rin"
