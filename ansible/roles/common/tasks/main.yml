---
# Common role - Install common dependencies and tools

- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: yes

- name: Install common packages
  ansible.builtin.package:
    name:
      - git
      - curl
      - wget
      - unzip
      - build-essential
      - ca-certificates
      - gnupg
      - lsb-release
      - python3
      - python3-pip
    state: present
  become: yes
  when: deployment_type == "homelab"

- name: Install Node.js repository
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
  become: yes
  when: deployment_type == "homelab" and ansible_os_family == "Debian"

- name: Install Node.js
  ansible.builtin.package:
    name: nodejs
    state: present
  become: yes
  when: deployment_type == "homelab"

- name: Download and install Bun
  ansible.builtin.shell: |
    curl -fsSL https://bun.sh/install | bash
  args:
    creates: /root/.bun/bin/bun
  become: yes
  when: deployment_type == "homelab"

- name: Add Bun to PATH
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: 'PATH="/root/.bun/bin:$PATH"'
    state: present
  become: yes
  when: deployment_type == "homelab"

- name: Install wrangler CLI for Cloudflare
  ansible.builtin.shell: |
    npm install -g wrangler
  args:
    creates: /usr/local/bin/wrangler
  when: deployment_type == "cloudflare"

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    create_home: yes
    home: "{{ app_base_dir }}"
    shell: /bin/bash
    system: yes
  become: yes
  when: deployment_type == "homelab"

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_base_dir }}/logs"
    - "{{ app_base_dir }}/backups"
    - "{{ app_base_dir }}/config"
  become: yes
  when: deployment_type == "homelab"
