---
# Homelab deployment role - includes web server and SSL setup

- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present
  become: yes

- name: Install Certbot for SSL
  ansible.builtin.package:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
  become: yes

- name: Create Nginx configuration for Rin
  ansible.builtin.template:
    src: nginx-rin.conf.j2
    dest: /etc/nginx/sites-available/rin
    mode: '0644'
  become: yes
  notify: Reload nginx

- name: Enable Rin site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/rin
    dest: /etc/nginx/sites-enabled/rin
    state: link
  become: yes
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: yes
  notify: Reload nginx

- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  become: yes
  changed_when: false

- name: Ensure Nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
  become: yes

- name: Obtain SSL certificate with Certbot
  ansible.builtin.command: >
    certbot --nginx -d {{ domain }}
    --non-interactive --agree-tos
    --email {{ ssl_email }}
    --redirect
  become: yes
  register: certbot_result
  changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
  failed_when: false

- name: Display SSL certificate status
  ansible.builtin.debug:
    var: certbot_result.stdout_lines

- name: Setup Certbot auto-renewal cron job
  ansible.builtin.cron:
    name: "Certbot renewal"
    special_time: daily
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    user: root
  become: yes

- name: Configure firewall for HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'
  become: yes
  when: ansible_facts.services['ufw.service'] is defined
